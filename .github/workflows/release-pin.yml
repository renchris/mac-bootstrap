name: release-pin

# The one-prompt and one-command paths both fetch bootstrap.sh on its own, so it has to fetch
# its own modules and assets from a pinned commit. The first release shipped the literal
# placeholder `__PIN_SHA__` and BOTH documented entry points died at exit 30 on a repo that was
# otherwise complete and public — a defect no test on this machine could see, because a clone
# always has modules/ beside the script. This job is the arm that can see it: it fetches what a
# stranger fetches, anonymously, and compares every byte against the pinned tree.
#
# macos-latest, not ubuntu-latest: hop 3 runs the README prompt's own commands against the PUBLISHED
# script, and the driver runs only on macOS, so on Linux it printed "hop 3: skipped" (run 34987227311)
# and the gate that runs on every push never ran it. Hops 1 and 2 are curl, shasum and git, identical
# on either runner, so a second Ubuntu job would add no coverage — only a second anonymous fetch of
# every file — and it was replaced rather than kept.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0        # --check reads `git show <pin>:<path>`; a shallow clone has no pin
      - run: bash scripts/release.sh --check
